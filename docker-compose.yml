
services:

  # ---------------- FRONTEND NEXT.JS ----------------
  maintenance-frontend:
    build: ./maintenance
    container_name: maintenance-frontend 
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
    networks:
      - app-network
    depends_on:
      - maintenance-app

  maintenance-app:
    build: ./manutecao-api
    container_name: maintenance-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/app/data/banco_manutencao.db
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.sqlite.JDBC
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    networks:
      - app-network
    volumes:
      - ./sqlite-data:/app/data
    

networks:
    app-network:
      driver: bridge
